PACKAGE_NAME="hid-asus-wake"
PACKAGE_VERSION="7.3.4.1"
# CachyOS 7.3.4-1 drivers/hid/hid-asus.c + a fix that wakes the keyboard before
# sending backlight / Fn-lock feature reports. Without it, with USB autosuspend on
# (71-asus-kbd-autosuspend.rules), writes while the keyboard is suspended fail:
# "Asus failed to set keyboard backlight: -108". Exact kernel only: a newer
# kernel gets the stock module (no stale driver code) until this is upstream.
BUILD_EXCLUSIVE_KERNEL="^7\.3\.4-1-cachyos"
MAKE[0]="make KERNELRELEASE=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KERNELRELEASE=${kernelver} KDIR=${kernel_source_dir} clean"
BUILT_MODULE_NAME[0]="hid-asus"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"
AUTOINSTALL="yes"
