# Intel Trace Hub (NPK) = hardware debug/tracing block, unused on a normal system.
# While its driver is bound, the PMC cannot power the NPK down, which blocks the
# S0i2.1 standby substate (requirement NPK_VNN_REQ_STS). Measured on this GU605MI
# 2026-11-11: driver loaded -> S0i2.0 only; driver unloaded -> S0i2.1.
blacklist intel_th_pci
blacklist intel_th_acpi
blacklist intel_th_gth
blacklist intel_th
