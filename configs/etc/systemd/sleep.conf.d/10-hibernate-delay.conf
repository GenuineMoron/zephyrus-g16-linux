[Sleep]
SuspendState=freeze
# Fallback window if /usr/local/bin/sleep-window-update fails; normally it
# writes /run/systemd/sleep.conf.d/50-battery-window.conf before each sleep.
HibernateDelaySec=1h
HibernateOnACPower=yes
# Wake briefly once an hour to measure the battery; systemd hibernates early if it
# is draining fast. (Set to 13h on 2026-11-13 after a hang that turned out to be
# the speaker-amp firmware deadlock, fixed by system-sleep/30-cs35l56-hibernate.)
# Each stretch is logged by system-sleep/40-sleep-stats.
SuspendEstimationSec=1h
