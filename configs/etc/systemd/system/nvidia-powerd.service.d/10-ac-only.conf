[Unit]
# Dynamic Boost is only useful on the charger (Windows disables it on battery too).
# asusd (disable_nvidia_powerd_on_battery) only reacts to plug/unplug events, so a
# boot on battery left it running and waking the CPU ~13 times a second all day.
# 81-nvidia-powerd-ac-only.rules starts/stops it on charger changes.
ConditionACPower=true
