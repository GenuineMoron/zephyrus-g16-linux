# mpv on the Zephyrus G16 (2026-11-15). See zephyrus repo docs/research/37.
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi
# HDR on Umbriel: tag the window with the video's own HDR metadata
# (mastering display, MaxCLL). The default ("target") sends the screen's
# SDR description, so the compositor never switches to HDR.
target-colorspace-hint=yes
target-colorspace-hint-mode=source
