# GTK 4 (4.16+) draws app windows with Vulkan by default. Creating a Vulkan
# instance makes NVIDIA's driver power up the sleeping RTX 4070 (~2 s GSP boot),
# so every GTK4 app launch (Files, dialogs, settings...) woke the dGPU and took
# ~2.6 s longer. GTK's OpenGL renderer draws through EGL on the Intel GPU and
# never touches NVIDIA. Games are unaffected: NVIDIA's Vulkan driver stays
# visible, so DXVK/VKD3D/native Vulkan games pick the RTX 4070 by themselves.
GSK_RENDERER=gl
# Even with the GL renderer, GTK 4.24 still creates a Vulkan instance in some apps
# (Loupe, the image viewer, for colour-managed images): measured 2026-11-15, Loupe
# held 14 /dev/nvidia* handles and woke the dGPU on every launch. GDK_DISABLE=vulkan
# turns GTK's own Vulkan use off entirely (0 handles, dGPU stays asleep). It only
# affects GTK; games and other Vulkan apps still see the NVIDIA GPU.
GDK_DISABLE=vulkan
