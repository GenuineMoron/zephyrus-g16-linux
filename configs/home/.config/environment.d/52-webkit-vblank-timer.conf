# WebKitGTK (Apostrophe's preview, other GNOME apps' web views) finds the
# screen's refresh timing by opening every DRM card and reading its connectors.
# Reading the NVIDIA card's connectors powers up the sleeping RTX 4070
# (traced 2026-11-17: libwebkitgtk drmModeGetResources/GetConnector ->
# nvidia-drm -> nvRmGetConnectedDpys -> runtime resume). A timer-based vblank
# keeps WebKit off the DRM cards; animations still follow the refresh rate.
WEBKIT_FORCE_VBLANK_TIMER=1
