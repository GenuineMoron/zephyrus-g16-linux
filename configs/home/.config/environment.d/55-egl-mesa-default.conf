# Intel by default, NVIDIA only when asked (2026-11-15).
# Many apps load every installed EGL driver when they start (browsers' media
# processes, the compositor's device scan). Loading NVIDIA's EGL opens
# /dev/nvidia* and powers up the sleeping RTX 4070 for nothing. Listing only
# Mesa keeps EGL on the Intel GPU. Vulkan (games, DXVK), GLX/X11 apps and CUDA
# are not affected. `prime-run` (~/.local/bin/prime-run) and a launcher's
# PRIME env put NVIDIA's EGL back for programs that should run on the RTX 4070.
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
