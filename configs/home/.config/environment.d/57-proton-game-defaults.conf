# Defaults for every Proton game (Steam and other launchers inherit them).
# NVIDIA 620 + PRIME on Umbriel: VKD3D-Proton's VK_EXT_present_timing breaks
# presentation (white window on Xwayland, swapchain crash on Wayland); DX12 only.
VKD3D_DISABLE_EXTENSIONS=VK_EXT_present_timing
# Frame cap safety net at 120 fps, an even divisor of the 240 Hz panel without
# VRR, and the governor's default target. Games capped lower in-game run lower.
DXVK_FRAME_RATE=120
VKD3D_FRAME_RATE=120
