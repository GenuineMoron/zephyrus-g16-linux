; GameMode only runs if a game asks for it (gamemoderun). Power is managed by
; game-governor.service (frame target, Balanced/Performance on demand), so
; GameMode must not change the CPU governor: intel_pstate's powersave governor
; is what lets the EPP strategy work.
[general]
desiredgov=powersave
igpu_desiredgov=powersave

[gpu]
apply_gpu_optimisations=0
