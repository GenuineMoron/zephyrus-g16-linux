[custom]
; On game start, switch the ASUS platform profile to Performance and back to
; the profile asusd uses for the current power source on exit (AC: Balanced,
; battery: Quiet). Performance unlocks the GPU power ceiling (55W -> 85W, plus
; Dynamic Boost up to 115W under load) AND raises CPU EPP to "performance",
; so the desktop stays quiet (Balanced) and only games run the chip hard.
start=/home/you/.local/bin/gamemode-profile start
end=/home/you/.local/bin/gamemode-profile end
